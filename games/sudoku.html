<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>스도쿠</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --text: var(--tg-theme-text-color, #f2f3f5);
    --hint: var(--tg-theme-hint-color, #8b8f98);
    --card: var(--tg-theme-secondary-bg-color, #1a1d24);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(128, 128, 128, .28);
    --line-strong: rgba(128, 128, 128, .65);
    --wrong: #ff5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .levels { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 12px; }
  .levels button {
    border: 0; background: transparent; color: var(--hint); font: inherit; font-size: 14px;
    padding: 8px 16px; border-radius: 9px; cursor: pointer;
  }
  .levels button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .hud {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; max-width: 460px; background: var(--card); border-radius: 12px; padding: 10px 14px;
    font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700;
  }
  .hud .lvl { color: var(--hint); font-weight: 500; font-size: 14px; }

  .board {
    width: min(100%, 460px); aspect-ratio: 1;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px;
    background: var(--line-strong); border-radius: 10px; overflow: hidden;
  }
  .box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
  .cell {
    background: var(--card); display: flex; align-items: center; justify-content: center;
    font-size: min(6.4vw, 28px); font-weight: 600; cursor: pointer; touch-action: manipulation;
    position: relative; min-width: 0; min-height: 0;
  }
  .cell.user { color: var(--accent); }
  .cell.wrong { color: var(--wrong); }
  .cell.rel { background: rgba(47, 128, 237, .10); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .cell.same { background: rgba(47, 128, 237, .25); background: color-mix(in srgb, var(--accent) 30%, var(--card)); }
  .cell.sel { background: rgba(47, 128, 237, .40); background: color-mix(in srgb, var(--accent) 45%, var(--card)); }
  .cell.dup { background: rgba(255, 91, 91, .28); }
  .notes {
    position: absolute; inset: 1px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    font-size: min(2.5vw, 11px); font-weight: 500; color: var(--hint);
  }
  .notes span { display: flex; align-items: center; justify-content: center; }

  .tools { display: flex; gap: 8px; width: 100%; max-width: 460px; }
  .tool {
    flex: 1; border: 0; border-radius: 12px; padding: 8px 4px; font: inherit; font-size: 12px; cursor: pointer;
    background: var(--card); color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tool b { font-size: 20px; font-weight: 400; }
  .tool.on { background: var(--accent); color: var(--accent-text); }
  .tool:disabled { opacity: .4; cursor: default; }

  .pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; width: 100%; max-width: 460px; }
  .num {
    border: 0; border-radius: 10px; padding: 8px 0 4px; font: inherit; cursor: pointer;
    background: var(--card); color: var(--accent); display: flex; flex-direction: column; align-items: center;
  }
  .num b { font-size: min(6.5vw, 26px); font-weight: 600; line-height: 1.1; }
  .num small { font-size: 10px; color: var(--hint); }
  .num:disabled { opacity: .25; cursor: default; }
  .best { font-size: 12px; color: var(--hint); min-height: 14px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .dialog { background: var(--card); border-radius: 18px; padding: 24px; text-align: center; width: min(320px, 100%); }
  .dialog h2 { margin: 0 0 8px; font-size: 24px; }
  .dialog p { margin: 0 0 18px; color: var(--hint); }
  .dialog button {
    border: 0; border-radius: 12px; padding: 12px 20px; width: 100%; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
</style>
</head>
<body>
  <div class="levels" id="levels">
    <button data-level="easy">쉬움</button>
    <button data-level="normal">보통</button>
    <button data-level="hard">어려움</button>
  </div>

  <div class="hud">
    <div id="mistakes">❌ 0/3</div>
    <div class="lvl" id="lvl"></div>
    <div id="time">⏱ 0:00</div>
  </div>

  <div class="board" id="board"></div>

  <div class="tools">
    <button class="tool" id="undo"><b>↩️</b>되돌리기</button>
    <button class="tool" id="erase"><b>⌫</b>지우기</button>
    <button class="tool" id="note"><b>✏️</b>메모 끔</button>
    <button class="tool" id="hintBtn"><b>💡</b>힌트 3</button>
  </div>

  <div class="pad" id="pad"></div>
  <div class="best" id="best"></div>

  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="again">새 게임</button>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  if (tg?.BackButton) {
    tg.BackButton.show();
    tg.BackButton.onClick(() => { location.href = '../index.html'; });
  }
  const haptic = {
    tap:   () => tg?.HapticFeedback?.selectionChanged(),
    place: () => tg?.HapticFeedback?.impactOccurred('light'),
    wrong: () => tg?.HapticFeedback?.notificationOccurred('error'),
    win:   () => tg?.HapticFeedback?.notificationOccurred('success'),
  };

  // 텔레그램 안에서는 CloudStorage(기기 간 동기화), 밖에서는 localStorage
  const useCloud = !!(tg?.initData && tg.isVersionAtLeast?.('6.9'));
  const store = {
    get(key) {
      return new Promise(res => {
        try {
          if (useCloud) tg.CloudStorage.getItem(key, (err, v) => res(err ? null : v || null));
          else res(localStorage.getItem(key));
        } catch { res(null); }
      });
    },
    set(key, value) {
      try {
        if (useCloud) tg.CloudStorage.setItem(key, String(value));
        else localStorage.setItem(key, String(value));
      } catch {}
    },
  };

  function askConfirm(msg) {
    return new Promise(res => {
      if (tg?.initData && tg.isVersionAtLeast?.('6.2')) tg.showConfirm(msg, ok => res(ok));
      else res(window.confirm(msg));
    });
  }

  const LEVELS = {
    easy:   { clues: 38, name: '쉬움' },
    normal: { clues: 30, name: '보통' },
    hard:   { clues: 24, name: '어려움' },
  };
  const MAX_MISTAKES = 3, MAX_HINTS = 3, SAVE_KEY = 'sd_save';

  // ---------- 퍼즐 생성기 ----------
  const RC = [...Array(81)].map((_, i) => {
    const r = (i / 9) | 0, c = i % 9;
    return [r, c, ((r / 3) | 0) * 3 + ((c / 3) | 0)];
  });
  const PEERS = RC.map(([r, c, b], i) => {
    const out = [];
    for (let j = 0; j < 81; j++)
      if (j !== i && (RC[j][0] === r || RC[j][1] === c || RC[j][2] === b)) out.push(j);
    return out;
  });
  const popcount = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };

  // 비트마스크 + MRV 백트래킹. limit개 해를 찾으면 멈춘다. onSolve가 있으면 해를 넘겨준다
  function solve(grid, { limit = 2, random = false, onSolve } = {}) {
    const g = grid.slice(), rows = Array(9).fill(0), cols = Array(9).fill(0), boxes = Array(9).fill(0);
    for (let i = 0; i < 81; i++) {
      if (!g[i]) continue;
      const [r, c, b] = RC[i], bit = 1 << g[i];
      if ((rows[r] | cols[c] | boxes[b]) & bit) return 0;
      rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
    }
    let count = 0;
    (function rec() {
      let best = -1, bestMask = 0, bestCnt = 10;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;
        const [r, c, b] = RC[i], m = ~(rows[r] | cols[c] | boxes[b]) & 0x3fe, n = popcount(m);
        if (!n) return false;
        if (n < bestCnt) { best = i; bestMask = m; bestCnt = n; if (n === 1) break; }
      }
      if (best < 0) { count++; onSolve?.(g.slice()); return count >= limit; }
      const digits = [];
      for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) digits.push(d);
      if (random) shuffle(digits);
      const [r, c, b] = RC[best];
      for (const d of digits) {
        const bit = 1 << d;
        g[best] = d; rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
        const stop = rec();
        g[best] = 0; rows[r] &= ~bit; cols[c] &= ~bit; boxes[b] &= ~bit;
        if (stop) return true;
      }
      return false;
    })();
    return count;
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 완성판을 무작위로 채운 뒤, 해가 하나로 유지되는 한 숫자를 지운다
  function generate(targetClues) {
    let full;
    solve(Array(81).fill(0), { limit: 1, random: true, onSolve: g => { full = g; } });
    const puzzle = full.slice();
    let clues = 81;
    for (const i of shuffle([...Array(81).keys()])) {
      if (clues <= targetClues) break;
      const keep = puzzle[i];
      puzzle[i] = 0;
      if (solve(puzzle, { limit: 2 }) !== 1) puzzle[i] = keep;
      else clues--;
    }
    return { puzzle, solution: full };
  }

  // ---------- 게임 상태 ----------
  const $ = id => document.getElementById(id);
  let level, puzzle, solution, values, notes, mistakes, hints, elapsed, over, sel = -1;
  let noteMode = false, undoStack = [], timerId = null;

  const locked = i => puzzle[i] !== 0 || values[i] === solution[i];

  // 3x3 박스마다 3x3 칸을 넣어서 굵은 경계선을 만든다
  const els = Array(81);
  for (let b = 0; b < 9; b++) {
    const box = document.createElement('div');
    box.className = 'box';
    for (let k = 0; k < 9; k++) {
      const r = ((b / 3) | 0) * 3 + ((k / 3) | 0), c = (b % 3) * 3 + (k % 3), i = r * 9 + c;
      const d = document.createElement('div');
      d.className = 'cell';
      d.dataset.i = i;
      box.appendChild(d);
      els[i] = d;
    }
    $('board').appendChild(box);
  }

  const padBtns = [];
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement('button');
    b.className = 'num';
    b.innerHTML = `<b>${d}</b><small></small>`;
    b.onclick = () => input(d);
    $('pad').appendChild(b);
    padBtns[d] = b;
  }

  function newGame(key = level) {
    level = key;
    const g = generate(LEVELS[key].clues);
    puzzle = g.puzzle; solution = g.solution;
    values = puzzle.slice();
    notes = Array(81).fill(0);
    mistakes = 0; hints = MAX_HINTS; elapsed = 0; over = false; sel = -1;
    undoStack = [];
    $('overlay').classList.remove('show');
    start();
    save();
  }

  function start() {
    document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', b.dataset.level === level));
    $('lvl').textContent = LEVELS[level].name;
    startTimer();
    render();
    showBest();
  }

  function startTimer() {
    clearInterval(timerId);
    timerId = setInterval(() => {
      if (over || document.hidden) return;
      elapsed++;
      updateHud();
      if (elapsed % 5 === 0) save();
    }, 1000);
  }

  const fmt = s => `${(s / 60) | 0}:${String(s % 60).padStart(2, '0')}`;

  function updateHud() {
    $('mistakes').textContent = `❌ ${mistakes}/${MAX_MISTAKES}`;
    $('time').textContent = `⏱ ${fmt(elapsed)}`;
    $('hintBtn').innerHTML = `<b>💡</b>힌트 ${hints}`;
    $('hintBtn').disabled = hints <= 0 || over;
    $('undo').disabled = !undoStack.length || over;
  }

  function render() {
    const sv = sel >= 0 ? values[sel] : 0;
    const [sr, sc, sb] = sel >= 0 ? RC[sel] : [-1, -1, -1];
    for (let i = 0; i < 81; i++) {
      const el = els[i], v = values[i], [r, c, b] = RC[i];
      const cls = ['cell'];
      if (v && !puzzle[i]) cls.push(v === solution[i] ? 'user' : 'wrong');
      if (i === sel) cls.push('sel');
      else if (sv && v === sv) cls.push('same');
      else if (r === sr || c === sc || b === sb) cls.push('rel');
      if (v && PEERS[i].some(j => values[j] === v)) cls.push('dup');
      el.className = cls.join(' ');
      if (v) el.textContent = v;
      else if (notes[i]) {
        let h = '<div class="notes">';
        for (let d = 1; d <= 9; d++) h += `<span>${notes[i] & (1 << d) ? d : ''}</span>`;
        el.innerHTML = h + '</div>';
      } else el.textContent = '';
    }
    for (let d = 1; d <= 9; d++) {
      let placed = 0;
      for (let i = 0; i < 81; i++) if (values[i] === d && solution[i] === d) placed++;
      padBtns[d].disabled = placed >= 9 || over;
      padBtns[d].querySelector('small').textContent = placed >= 9 ? '' : 9 - placed;
    }
    updateHud();
  }

  // ---------- 입력 / 되돌리기 ----------
  let change = null;
  const begin = () => { change = []; };
  const touch = i => { change.push([i, values[i], notes[i]]); };
  const commit = () => { undoStack.push(change); if (undoStack.length > 300) undoStack.shift(); change = null; };

  function setValue(i, d) {
    touch(i);
    values[i] = d;
    notes[i] = 0;
    // 맞는 숫자를 넣으면 같은 행/열/박스 메모에서 그 숫자를 지운다
    if (d === solution[i]) {
      for (const j of PEERS[i]) if (notes[j] & (1 << d)) { touch(j); notes[j] &= ~(1 << d); }
    }
  }

  function input(d) {
    if (over || sel < 0 || locked(sel)) return;
    if (noteMode) {
      if (values[sel]) return;
      begin(); touch(sel); notes[sel] ^= 1 << d; commit();
      haptic.tap();
    } else {
      if (values[sel] === d) return;
      begin(); setValue(sel, d); commit();
      if (d !== solution[sel]) {
        mistakes++;
        haptic.wrong();
      } else haptic.place();
    }
    after();
  }

  function erase() {
    if (over || sel < 0 || locked(sel) || (!values[sel] && !notes[sel])) return;
    begin(); touch(sel); values[sel] = 0; notes[sel] = 0; commit();
    haptic.tap();
    after();
  }

  function undo() {
    if (over || !undoStack.length) return;
    const ch = undoStack.pop();
    for (let k = ch.length - 1; k >= 0; k--) {
      const [i, v, n] = ch[k];
      values[i] = v; notes[i] = n;
    }
    haptic.tap();
    after();
  }

  function hint() {
    if (over || hints <= 0) return;
    let target = sel >= 0 && !locked(sel) ? sel : -1;
    if (target < 0) {
      const open = [...Array(81).keys()].filter(i => values[i] !== solution[i]);
      if (!open.length) return;
      target = open[Math.floor(Math.random() * open.length)];
    }
    hints--;
    sel = target;
    begin(); setValue(target, solution[target]); commit();
    haptic.place();
    after();
  }

  function after() {
    render();
    if (mistakes >= MAX_MISTAKES) return lose();
    if (values.every((v, i) => v === solution[i])) return win();
    save();
  }

  function lose() {
    over = true;
    clearInterval(timerId);
    clearSave();
    render();
    showResult('게임 오버 😵', `실수 ${MAX_MISTAKES}번 · ${LEVELS[level].name}`);
  }

  async function win() {
    over = true;
    clearInterval(timerId);
    clearSave();
    sel = -1;
    render();
    haptic.win();
    const key = 'sd_best_' + level;
    const prev = Number(await store.get(key)) || 0;
    const record = !prev || elapsed < prev;
    if (record) store.set(key, elapsed);
    showBest(record ? elapsed : prev);
    showResult(record ? '신기록! 🏆' : '클리어! 🎉',
      `${LEVELS[level].name} · ${fmt(elapsed)}${record ? '' : ` (최고 ${fmt(prev)})`}`);
  }

  function showResult(title, text) {
    $('resultTitle').textContent = title;
    $('resultText').textContent = text;
    $('overlay').classList.add('show');
  }

  async function showBest(known) {
    const v = known ?? Number(await store.get('sd_best_' + level));
    $('best').textContent = v ? `${LEVELS[level].name} 최고 기록: ${fmt(v)}` : '';
  }

  // ---------- 진행 중 게임 저장 / 이어하기 ----------
  function save() {
    if (over) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ level, puzzle, solution, values, notes, mistakes, hints, elapsed }));
    } catch {}
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch {} }
  function resume() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!s || !LEVELS[s.level] || s.puzzle?.length !== 81) return false;
      ({ level, puzzle, solution, values, notes, mistakes, hints, elapsed } = s);
      over = false; sel = -1; undoStack = [];
      start();
      return true;
    } catch { return false; }
  }
  const inProgress = () => !over && values.some((v, i) => v !== puzzle[i]);

  // ---------- 이벤트 ----------
  $('board').addEventListener('click', e => {
    const el = e.target.closest('.cell');
    if (!el || over) return;
    sel = +el.dataset.i;
    haptic.tap();
    render();
  });
  $('undo').onclick = undo;
  $('erase').onclick = erase;
  $('hintBtn').onclick = hint;
  $('note').onclick = () => {
    noteMode = !noteMode;
    $('note').classList.toggle('on', noteMode);
    $('note').innerHTML = `<b>✏️</b>메모 ${noteMode ? '켬' : '끔'}`;
    haptic.tap();
  };
  $('again').onclick = () => newGame();
  $('levels').onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (inProgress() && !(await askConfirm('진행 중인 게임을 버리고 새로 시작할까요?'))) return;
    newGame(b.dataset.level);
  };
  document.addEventListener('keydown', e => {
    if (over) return;
    if (e.key >= '1' && e.key <= '9') input(+e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
    else if ((e.ctrlKey || e.metaKey) && e.key === 'z') undo();
    else if (e.key === 'n') $('note').click();
    else if (e.key.startsWith('Arrow')) {
      if (sel < 0) sel = 0;
      else {
        const [r, c] = RC[sel];
        const dr = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
        const dc = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
        sel = ((r + dr + 9) % 9) * 9 + (c + dc + 9) % 9;
      }
      e.preventDefault();
      render();
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  if (!resume()) newGame('easy');
</script>
</body>
</html>
