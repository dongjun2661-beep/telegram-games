<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>체스</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --text: var(--tg-theme-text-color, #f2f3f5);
    --hint: var(--tg-theme-hint-color, #8b8f98);
    --card: var(--tg-theme-secondary-bg-color, #1a1d24);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --light: #e9d8b6;
    --dark: #b07f55;
    --sel: rgba(255, 214, 10, .55);
    --last: rgba(255, 214, 10, .3);
    --sq: 40px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .status {
    width: 100%; max-width: 480px; background: var(--card); border-radius: 12px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center; font-weight: 600;
  }
  .status .sub { font-size: 12px; color: var(--hint); font-weight: 400; }
  .captured {
    width: 100%; max-width: 480px; min-height: 26px; font-size: 20px; line-height: 26px;
    display: flex; align-items: center; gap: 1px; flex-wrap: wrap;
  }
  .captured .adv { font-size: 12px; color: var(--hint); margin-left: 6px; }
  .board {
    display: grid; grid-template-columns: repeat(8, var(--sq)); grid-template-rows: repeat(8, var(--sq));
    border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.35);
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--sq) * .78); line-height: 1; cursor: pointer; touch-action: manipulation;
  }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .sq.last::before, .sq.sel::before, .sq.check::before { content: ''; position: absolute; inset: 0; }
  .sq.last::before { background: var(--last); }
  .sq.sel::before { background: var(--sel); }
  .sq.check::before { background: radial-gradient(circle, rgba(255,40,40,.9) 0%, rgba(255,40,40,.4) 55%, transparent 75%); }
  .sq .pc { position: relative; z-index: 1; }
  .pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 1px 2px rgba(0,0,0,.6); }
  .pc.b { color: #1b1b1b; text-shadow: 0 0 1px rgba(255,255,255,.35); }
  .sq.dot::after {
    content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%;
    background: rgba(0,0,0,.25); z-index: 2;
  }
  .sq.ring::after {
    content: ''; position: absolute; inset: 4%; border-radius: 50%;
    border: calc(var(--sq) * .08) solid rgba(0,0,0,.3); z-index: 2;
  }
  .coord { position: absolute; font-size: 10px; font-weight: 700; z-index: 1; opacity: .75; }
  .coord.f { right: 3px; bottom: 1px; }
  .coord.r { left: 3px; top: 2px; }
  .sq.l .coord { color: var(--dark); }
  .sq.d .coord { color: var(--light); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-size: 15px; cursor: pointer;
    background: var(--card); color: var(--text);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn:disabled { opacity: .4; cursor: default; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .dialog { background: var(--card); border-radius: 18px; padding: 22px; text-align: center; width: min(340px, 100%); }
  .dialog h2 { margin: 0 0 8px; font-size: 22px; }
  .dialog p { margin: 0 0 16px; color: var(--hint); }
  .dialog .btn { width: 100%; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
  .seg { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--hint); font: inherit; font-size: 14px;
    padding: 8px 4px; border-radius: 7px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .stats { font-size: 12px; color: var(--hint); margin-top: 6px; min-height: 15px; }
  .promo { display: flex; gap: 8px; justify-content: center; }
  .promo button {
    width: 64px; height: 64px; border: 0; border-radius: 12px; background: var(--light);
    font-size: 46px; line-height: 1; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="status">
    <div>
      <div id="turn">백 차례</div>
      <div class="sub" id="modeLabel"></div>
    </div>
    <div class="sub" id="moveNo"></div>
  </div>

  <div class="captured" id="capTop"></div>
  <div class="board" id="board"></div>
  <div class="captured" id="capBottom"></div>

  <div class="controls">
    <button class="btn" id="undo">↩️ 무르기</button>
    <button class="btn" id="flip">🔄 뒤집기</button>
    <button class="btn primary" id="new">새 게임</button>
  </div>

  <!-- 새 게임 설정 -->
  <div class="overlay" id="setup">
    <div class="dialog">
      <h2>♟️ 새 게임</h2>
      <div class="field">
        <label>모드</label>
        <div class="seg" data-key="mode">
          <button data-v="ai">AI 대전</button>
          <button data-v="pvp">2인 대전</button>
        </div>
      </div>
      <div class="field ai-only">
        <label>내 색</label>
        <div class="seg" data-key="color">
          <button data-v="w">백</button>
          <button data-v="b">흑</button>
          <button data-v="r">랜덤</button>
        </div>
      </div>
      <div class="field ai-only">
        <label>난이도</label>
        <div class="seg" data-key="level">
          <button data-v="easy">쉬움</button>
          <button data-v="normal">보통</button>
          <button data-v="hard">어려움</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <button class="btn" id="start">시작</button>
    </div>
  </div>

  <!-- 프로모션 선택 -->
  <div class="overlay" id="promoBox">
    <div class="dialog">
      <h2>승진할 기물</h2>
      <p>폰이 끝에 도착했어요</p>
      <div class="promo" id="promo"></div>
    </div>
  </div>

  <!-- 결과 -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="again">새 게임</button>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  if (tg?.BackButton) {
    tg.BackButton.show();
    tg.BackButton.onClick(() => { location.href = '../index.html'; });
  }
  const haptic = {
    tap:     () => tg?.HapticFeedback?.selectionChanged(),
    move:    () => tg?.HapticFeedback?.impactOccurred('light'),
    capture: () => tg?.HapticFeedback?.impactOccurred('medium'),
    check:   () => tg?.HapticFeedback?.notificationOccurred('warning'),
    win:     () => tg?.HapticFeedback?.notificationOccurred('success'),
    lose:    () => tg?.HapticFeedback?.notificationOccurred('error'),
  };

  // 텔레그램 안에서는 CloudStorage(기기 간 동기화), 밖에서는 localStorage
  const useCloud = !!(tg?.initData && tg.isVersionAtLeast?.('6.9'));
  const store = {
    get(key) {
      return new Promise(res => {
        try {
          if (useCloud) tg.CloudStorage.getItem(key, (err, v) => res(err ? null : v || null));
          else res(localStorage.getItem(key));
        } catch { res(null); }
      });
    },
    set(key, value) {
      try {
        if (useCloud) tg.CloudStorage.setItem(key, String(value));
        else localStorage.setItem(key, String(value));
      } catch {}
    },
  };

  const CHESS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js';
  const SAVE_KEY = 'chess_save';
  const LEVEL_NAME = { easy: '쉬움', normal: '보통', hard: '어려움' };
  const COLOR_NAME = { w: '백', b: '흑' };
  // U+FE0E: iOS가 ♟를 이모지로 바꾸지 않도록 텍스트 표시 강제
  const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const glyph = t => GLYPH[t] + '︎';
  const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

  // ---------- AI 엔진 (워커와 메인 스레드 양쪽에서 쓰도록 자기완결 함수) ----------
  function createEngine() {
    const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    // 백 기준, 0행 = 8랭크
    const PST = {
      p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],
          [0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
      n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],
          [-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
      b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],
          [-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
      r: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],
          [-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
      q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],
          [0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
      k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],
          [-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]],
    };
    const MATE = 100000;
    const DEPTH = { easy: 1, normal: 2, hard: 3 };

    // 백 관점 점수
    function evaluate(g) {
      const b = g.board();
      let s = 0;
      for (let r = 0; r < 8; r++)
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p) continue;
          if (p.color === 'w') s += VAL[p.type] + PST[p.type][r][c];
          else s -= VAL[p.type] + PST[p.type][7 - r][c];
        }
      return s;
    }

    // 잡는 수(MVV-LVA)와 승진을 먼저 탐색해 알파베타 가지치기 효율을 높인다
    function order(moves) {
      const key = m => (m.captured ? 10 * VAL[m.captured] - VAL[m.piece] : 0) + (m.promotion ? VAL[m.promotion] : 0);
      return moves.map(m => [key(m), m]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
    }

    function search(g, depth, alpha, beta, color) {
      if (depth === 0) return color * evaluate(g);
      const moves = g.moves({ verbose: true });
      if (!moves.length) return g.in_check() ? -MATE - depth : 0;
      for (const m of order(moves)) {
        g.move(m);
        const s = -search(g, depth - 1, -beta, -alpha, -color);
        g.undo();
        if (s >= beta) return s;
        if (s > alpha) alpha = s;
      }
      return alpha;
    }

    function think(fen, level) {
      const g = new Chess(fen);
      let moves = g.moves({ verbose: true });
      if (!moves.length) return null;
      // 같은 점수의 수 중에서 매번 다르게 고르도록 먼저 섞는다
      for (let i = moves.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [moves[i], moves[j]] = [moves[j], moves[i]];
      }
      let pick;
      if (level === 'easy' && Math.random() < 0.3) {
        pick = moves[0];
      } else {
        const color = g.turn() === 'w' ? 1 : -1;
        let best = -Infinity, alpha = -Infinity;
        for (const m of order(moves)) {
          g.move(m);
          const s = -search(g, DEPTH[level] - 1, -Infinity, -alpha, -color);
          g.undo();
          if (s > best) { best = s; pick = m; }
          if (s > alpha) alpha = s;
        }
      }
      return { from: pick.from, to: pick.to, promotion: pick.promotion };
    }

    return { think };
  }

  // 워커에서 AI를 돌려 UI가 멈추지 않게 하고, 워커를 못 쓰면 메인 스레드로 대체
  let worker = null;
  try {
    const src = `importScripts('${CHESS_URL}');
      const engine = (${createEngine.toString()})();
      onmessage = e => postMessage({ id: e.data.id, move: engine.think(e.data.fen, e.data.level) });`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch { worker = null; }
  let mainEngine = null;
  let aiRequest = 0;
  const aiCallbacks = new Map();
  if (worker) {
    worker.onmessage = e => {
      const cb = aiCallbacks.get(e.data.id);
      aiCallbacks.delete(e.data.id);
      pendingArgs.delete(e.data.id);
      cb?.(e.data.move);
    };
    worker.onerror = () => { worker = null; for (const [id, cb] of aiCallbacks) runOnMain(id, cb); aiCallbacks.clear(); };
  }
  const pendingArgs = new Map();
  function runOnMain(id, cb) {
    const { fen, level } = pendingArgs.get(id);
    setTimeout(() => { mainEngine ??= createEngine(); cb(mainEngine.think(fen, level)); }, 30);
  }
  function askAI(fen, level, cb) {
    const id = ++aiRequest;
    pendingArgs.set(id, { fen, level });
    if (worker) { aiCallbacks.set(id, cb); worker.postMessage({ id, fen, level }); }
    else runOnMain(id, cb);
    return id;
  }

  // ---------- 게임 상태 ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board');
  const settings = { mode: 'ai', color: 'w', level: 'normal' };

  let game = new Chess();
  let mode = 'ai', aiColor = 'b', level = 'normal', flipped = false;
  let selected = null, legal = [], thinking = false, over = false, activeAI = 0;

  function save() {
    try {
      if (over) localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, JSON.stringify({ moves: game.history(), fen: game.fen(), mode, aiColor, level, flipped }));
    } catch {}
  }

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!s) return false;
      const g = new Chess();
      // 수순을 다시 두어 무르기·3회 반복 판정을 살리고, 실패하면 FEN으로 복구
      const ok = s.moves.every(san => g.move(san));
      game = ok ? g : new Chess(s.fen);
      ({ mode, aiColor, level, flipped } = s);
      return true;
    } catch { return false; }
  }

  function startGame() {
    mode = settings.mode;
    level = settings.level;
    const mine = settings.color === 'r' ? (Math.random() < .5 ? 'w' : 'b') : settings.color;
    aiColor = mine === 'w' ? 'b' : 'w';
    flipped = mode === 'ai' && mine === 'b';
    game = new Chess();
    over = false;
    activeAI++;
    thinking = false;
    clearSelection();
    $('setup').classList.remove('show');
    $('overlay').classList.remove('show');
    save();
    render();
    maybeAI();
  }

  function clearSelection() { selected = null; legal = []; }

  function isPlayersTurn() { return !(mode === 'ai' && game.turn() === aiColor); }

  function kingSquare(color) {
    const b = game.board();
    for (let r = 0; r < 8; r++)
      for (let c = 0; c < 8; c++) {
        const p = b[r][c];
        if (p && p.type === 'k' && p.color === color) return 'abcdefgh'[c] + (8 - r);
      }
    return null;
  }

  // ---------- 렌더링 ----------
  function sizeBoard() {
    const avail = Math.min(window.innerWidth - 24, 480);
    document.documentElement.style.setProperty('--sq', Math.floor(avail / 8) + 'px');
  }

  function render() {
    const hist = game.history({ verbose: true });
    const last = hist[hist.length - 1];
    const check = game.in_check() ? kingSquare(game.turn()) : null;
    const targets = new Map(legal.map(m => [m.to, m]));
    boardEl.innerHTML = '';
    for (let i = 0; i < 8; i++)
      for (let j = 0; j < 8; j++) {
        const rank = flipped ? i + 1 : 8 - i;
        const file = flipped ? 7 - j : j;
        const sq = 'abcdefgh'[file] + rank;
        const el = document.createElement('div');
        el.className = 'sq ' + ((file + rank) % 2 ? 'l' : 'd');
        el.dataset.sq = sq;
        if (last && (sq === last.from || sq === last.to)) el.classList.add('last');
        if (sq === selected) el.classList.add('sel');
        if (sq === check) el.classList.add('check');
        const t = targets.get(sq);
        if (t) el.classList.add(t.captured ? 'ring' : 'dot');
        const p = game.get(sq);
        if (p) el.innerHTML = `<span class="pc ${p.color}">${glyph(p.type)}</span>`;
        if (j === 0) el.insertAdjacentHTML('beforeend', `<span class="coord r">${rank}</span>`);
        if (i === 7) el.insertAdjacentHTML('beforeend', `<span class="coord f">${'abcdefgh'[file]}</span>`);
        boardEl.appendChild(el);
      }
    renderCaptured(hist);
    renderStatus();
  }

  function renderCaptured(hist) {
    const taken = { w: [], b: [] }; // 각 색이 잡은 기물
    for (const m of hist) if (m.captured) taken[m.color].push(m.captured);
    const score = c => taken[c].reduce((s, t) => s + VALUE[t], 0);
    const html = c => {
      const enemy = c === 'w' ? 'b' : 'w';
      const sorted = taken[c].slice().sort((a, b) => VALUE[b] - VALUE[a]);
      const diff = score(c) - score(enemy);
      return sorted.map(t => `<span class="pc ${enemy}">${glyph(t)}</span>`).join('') +
        (diff > 0 ? `<span class="adv">+${diff}</span>` : '');
    };
    // 아래쪽은 화면 아래에 있는 색이 잡은 기물
    const bottom = flipped ? 'b' : 'w';
    $('capBottom').innerHTML = html(bottom);
    $('capTop').innerHTML = html(bottom === 'w' ? 'b' : 'w');
  }

  function renderStatus() {
    const turn = COLOR_NAME[game.turn()];
    let text;
    if (over) text = '게임 종료';
    else if (thinking) text = '🤔 AI 생각 중…';
    else if (mode === 'ai') text = isPlayersTurn() ? '내 차례' : 'AI 차례';
    else text = `${turn} 차례`;
    if (!over && game.in_check()) text += ' · 체크!';
    $('turn').textContent = text;
    $('modeLabel').textContent = mode === 'ai'
      ? `AI 대전 · ${LEVEL_NAME[level]} · 나: ${COLOR_NAME[aiColor === 'w' ? 'b' : 'w']}`
      : '2인 대전';
    $('moveNo').textContent = `${Math.ceil(game.history().length / 2) || 0}수`;
    $('undo').disabled = thinking || game.history().length === 0;
  }

  // ---------- 입력 ----------
  boardEl.addEventListener('click', e => {
    const el = e.target.closest('.sq');
    if (!el || over || thinking || !isPlayersTurn()) return;
    const sq = el.dataset.sq;
    const target = legal.filter(m => m.to === sq);
    if (selected && target.length) {
      if (target.some(m => m.promotion)) choosePromotion(game.turn(), p => doMove({ from: selected, to: sq, promotion: p }));
      else doMove({ from: selected, to: sq });
      return;
    }
    const p = game.get(sq);
    if (p && p.color === game.turn() && sq !== selected) {
      selected = sq;
      legal = game.moves({ square: sq, verbose: true });
      haptic.tap();
    } else clearSelection();
    render();
  });

  function choosePromotion(color, cb) {
    const box = $('promo');
    box.innerHTML = '';
    for (const t of ['q', 'r', 'b', 'n']) {
      const b = document.createElement('button');
      b.innerHTML = `<span class="pc ${color}">${glyph(t)}</span>`;
      b.onclick = () => { $('promoBox').classList.remove('show'); cb(t); };
      box.appendChild(b);
    }
    $('promoBox').classList.add('show');
  }

  function doMove(m) {
    const res = game.move(m);
    if (!res) return;
    clearSelection();
    if (game.in_check()) haptic.check();
    else if (res.captured) haptic.capture();
    else haptic.move();
    save();
    render();
    if (!checkEnd()) maybeAI();
  }

  function maybeAI() {
    if (over || mode !== 'ai' || game.turn() !== aiColor) return;
    thinking = true;
    renderStatus();
    const token = ++activeAI;
    const started = Date.now();
    askAI(game.fen(), level, move => {
      // 새 게임/무르기로 상황이 바뀌었으면 결과를 버린다
      if (token !== activeAI) return;
      setTimeout(() => {
        if (token !== activeAI) return;
        thinking = false;
        if (move) doMove(move);
        else renderStatus();
      }, Math.max(0, 350 - (Date.now() - started)));
    });
  }

  function checkEnd() {
    if (!game.game_over()) return false;
    over = true;
    save();
    render();
    let title, text;
    if (game.in_checkmate()) {
      const winner = game.turn() === 'w' ? 'b' : 'w';
      if (mode === 'ai') {
        const won = winner !== aiColor;
        title = won ? '승리! 🏆' : '패배 😢';
        won ? haptic.win() : haptic.lose();
        recordResult(won ? 'w' : 'l');
      } else {
        title = `${COLOR_NAME[winner]} 승리! 🏆`;
        haptic.win();
      }
      text = '체크메이트';
    } else {
      title = '무승부 🤝';
      if (game.in_stalemate()) text = '스테일메이트';
      else if (game.in_threefold_repetition()) text = '같은 국면 3회 반복';
      else if (game.insufficient_material()) text = '체크메이트할 기물 부족';
      else text = '50수 규칙';
      if (mode === 'ai') recordResult('d');
    }
    setTimeout(() => {
      $('resultTitle').textContent = title;
      $('resultText').textContent = text;
      $('overlay').classList.add('show');
    }, 450);
    return true;
  }

  // AI 전적: 난이도별 "승/패/무"
  async function recordResult(r) {
    const key = 'chess_stats_' + level;
    const [w, l, d] = ((await store.get(key)) || '0/0/0').split('/').map(Number);
    store.set(key, [w + (r === 'w'), l + (r === 'l'), d + (r === 'd')].join('/'));
  }

  async function showStats() {
    const v = await store.get('chess_stats_' + settings.level);
    const [w, l, d] = (v || '0/0/0').split('/').map(Number);
    $('stats').textContent = w + l + d ? `${LEVEL_NAME[settings.level]} 전적: ${w}승 ${l}패 ${d}무` : '';
  }

  // ---------- 버튼 ----------
  $('undo').onclick = () => {
    if (thinking || !game.history().length) return;
    activeAI++;
    game.undo();
    // AI 대전에서는 내 수까지 함께 무른다
    if (mode === 'ai') while (game.turn() === aiColor && game.history().length) game.undo();
    over = false;
    clearSelection();
    $('overlay').classList.remove('show');
    haptic.tap();
    save();
    render();
    maybeAI();
  };
  $('flip').onclick = () => { flipped = !flipped; haptic.tap(); save(); render(); };
  $('new').onclick = openSetup;
  $('again').onclick = openSetup;
  $('start').onclick = startGame;

  function openSetup() {
    $('overlay').classList.remove('show');
    syncSetup();
    $('setup').classList.add('show');
  }

  function syncSetup() {
    document.querySelectorAll('#setup .seg').forEach(seg => {
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === settings[seg.dataset.key]));
    });
    document.querySelectorAll('#setup .ai-only').forEach(f => { f.style.display = settings.mode === 'ai' ? '' : 'none'; });
    showStats();
  }

  document.querySelectorAll('#setup .seg').forEach(seg => {
    seg.onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      settings[seg.dataset.key] = b.dataset.v;
      haptic.tap();
      syncSetup();
    };
  });

  window.addEventListener('resize', sizeBoard);

  sizeBoard();
  if (load()) {
    settings.mode = mode;
    settings.level = level;
    render();
    maybeAI();
  } else {
    render();
    openSetup();
  }
</script>
</body>
</html>
